name: PR verification

on:
  pull_request:
    branches: [dev/master, master]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: NestCloud / lint, test, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v7
        with:
          path: NestCloud
          persist-credentials: false

      - name: Check out NestCloud SDK
        uses: actions/checkout@v7
        with:
          repository: ss-sola/NestCloud-Sdk
          ref: dev/master
          token: ${{ secrets.NESTCLOUD_SDK_READ_TOKEN || github.token }}
          path: NestCloud-Sdk
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: NestCloud/package.json

      - name: Build SDK
        working-directory: NestCloud-Sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install application dependencies
        working-directory: NestCloud
        run: pnpm install --frozen-lockfile

      - name: Lint, test, type-check and build
        working-directory: NestCloud
        run: |
          pnpm run lint
          pnpm run test
          pnpm run tsgo
          pnpm run build
