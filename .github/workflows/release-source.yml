name: Master release source

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  pull-requests: read
  statuses: write

jobs:
  release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Only read GitHub PR metadata from the protected base workflow. Do not check out PR code.
      - name: Verify the release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repository = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };

          let pr;
          for (let attempt = 0; attempt < 15; attempt++) {
            const response = await fetch(`${repository}/pulls/${event.number}`, { headers });
            if (!response.ok) throw new Error(`Pull request lookup failed: ${response.status}`);
            pr = await response.json();
            if (pr.state !== 'open' || pr.base.ref !== 'master' || pr.head.sha !== event.pull_request.head.sha) {
              throw new Error('The pull request changed before the source check ran.');
            }
            if (pr.mergeable === true && pr.merge_commit_sha) break;
            await setTimeout(2000);
          }
          if (pr.mergeable !== true || !pr.merge_commit_sha) throw new Error('The proposed merge is unavailable.');

          const allowed = pr.head.repo?.id === pr.base.repo.id && pr.head.ref === 'dev/master';
          const status = await fetch(`${repository}/statuses/${pr.merge_commit_sha}`, {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              context: 'NestCloud / master source',
              state: allowed ? 'success' : 'failure',
              description: allowed ? 'Source is the repository dev/master branch' : 'Only the repository dev/master branch may merge into master',
              target_url: pr.html_url,
            }),
          });
          if (!status.ok) throw new Error(`Could not report the release source: ${status.status}`);
          if (!allowed) throw new Error('Open release pull requests from this repository’s dev/master branch.');
          NODE
