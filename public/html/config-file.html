<div>
  <div class="modal fade config-workspace" id="configModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-fullscreen-md-down">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modalTitle">新增配置</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <form id="configForm" class="config-layout">
            <aside class="config-inspector">
              <label class="config-field">文件名<input class="form-control" id="configName" placeholder="例如 system-service.jsonc" required /></label>
              <label class="config-field">格式<select class="form-select" id="configFormat" required>
                <option value="jsonc">JSONC</option><option value="json">JSON</option>
                <option value="yaml">YAML</option><option value="yml">YML</option>
                <option value="env">ENV</option><option value="properties">Properties</option>
              </select></label>
              <label class="config-field">说明<textarea class="form-control" id="configDescription" rows="2" placeholder="配置用途（选填）"></textarea></label>
              <dl class="config-properties">
                <dt>版本</dt><dd id="configVersion"></dd><dt>状态</dt><dd id="configStatus"></dd>
                <dt>发布时间</dt><dd id="configPublishedAt"></dd>
              </dl>
              <details class="config-checksum"><summary>MD5 校验值</summary><code id="configMd5"></code></details>
            </aside>
            <section class="config-source" aria-label="配置编辑器">
              <div class="config-source-bar"><strong>配置内容</strong>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="formatJsonBtn">格式化</button></div>
              <div id="jsoneditor" class="json-editor-panel"></div>
            </section>
          </form>
        </div>
        <div class="modal-footer">
          <small class="text-muted me-auto" id="modalHint"></small>
          <button type="button" class="btn btn-outline-primary" id="saveBtn">保存草稿</button>
          <button type="button" class="btn btn-primary" id="publishBtn">保存并发布</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade config-workspace" id="viewModal" tabindex="-1" aria-labelledby="viewModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-fullscreen-md-down">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="viewModalTitle">查看配置</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body config-layout">
          <aside class="config-inspector">
            <dl class="config-properties">
              <dt>格式</dt><dd id="viewConfigFormat"></dd><dt>版本</dt><dd id="viewConfigVersion"></dd>
              <dt>状态</dt><dd id="viewConfigStatus"></dd><dt>发布时间</dt><dd id="viewConfigPublishedAt"></dd>
            </dl>
            <div id="viewDescriptionGroup"><strong>说明</strong><p id="viewConfigDescription"></p></div>
          </aside>
          <section class="config-source" aria-label="配置预览">
            <div class="config-source-bar"><strong>配置内容</strong><span>只读</span></div>
            <div id="viewJsonEditor" class="json-editor-panel"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content config-modal-shell">
        <div class="modal-header">
          <h5 class="modal-title" id="historyModalTitle">版本历史</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th width="90">ID</th>
                  <th width="110">版本</th>
                  <th width="100">格式</th>
                  <th width="100">状态</th>
                  <th>说明</th>
                  <th width="170">发布时间</th>
                  <th width="170">更新时间</th>
                  <th width="100">操作</th>
                </tr>
              </thead>
              <tbody id="historyTableBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="historyEmptyState" style="display: none">
            <p>暂无版本历史</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">确认删除</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <p>确定要删除此配置吗？删除后将无法恢复。</p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline-primary"
            data-bs-dismiss="modal"
          >
            取消
          </button>
          <button type="button" class="btn btn-primary" id="confirmDeleteBtn">
            确认删除
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="content-header">
  <div>
    <h5 class="mb-1">配置管理</h5>
    <div class="text-muted small">统一维护配置内容、草稿发布和在线预览。</div>
  </div>
</div>
<div class="content-body">
  <div class="config-overview-grid mb-4">
    <div class="overview-card">
      <span class="overview-label">配置总数</span>
      <strong id="totalCount">0</strong>
    </div>
    <div class="overview-card">
      <span class="overview-label">已发布</span>
      <strong id="publishedCount">0</strong>
    </div>
    <div class="overview-card">
      <span class="overview-label">草稿</span>
      <strong id="draftCount">0</strong>
    </div>
    <div class="overview-card overview-card-wide">
      <span class="overview-label">当前页</span>
      <strong id="pageSummary">第 1 页</strong>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="config-toolbar w-100">
        <div class="config-filter-group">
          <input
            type="text"
            class="form-control search-box"
            id="searchInput"
            placeholder="根据名称搜索..."
          />
          <select class="form-select status-filter" id="statusFilter">
            <option value="">全部状态</option>
            <option value="true">已发布</option>
            <option value="false">草稿</option>
          </select>
          <select class="form-select status-filter" id="formatFilter">
            <option value="">全部格式</option>
            <option value="yaml">YAML</option>
            <option value="yml">YML</option>
            <option value="jsonc">JSONC</option><option value="json">JSON</option>
            <option value="env">ENV</option>
            <option value="properties">Properties</option>
          </select>
          <button class="btn btn-outline-primary" id="refreshBtn">刷新</button>
        </div>
        <button class="btn btn-primary ms-auto" id="addBtn">
          <i>+</i> 新增配置
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>名称</th>
              <th width="120">最新发布</th>
              <th width="120">当前草稿</th>
              <th width="100">格式</th>
              <th width="120">显示版本</th>
              <th width="170">更新时间</th>
              <th width="320">操作</th>
            </tr>
          </thead>
          <tbody id="configTableBody">
            <!-- 动态生成 -->
          </tbody>
        </table>
      </div>

      <div class="empty-state" id="emptyState" style="display: none">
        <i style="font-size: 48px; margin-bottom: 10px">📭</i>
        <p>暂无数据</p>
      </div>

      <nav aria-label="Page navigation">
        <ul class="pagination" id="pagination">
          <!-- 动态生成 -->
        </ul>
      </nav>
    </div>
  </div>
</div>
